[project]
name = "komap2026-phase-seg"
version = "1.0.0"
description = "UNet++ / HRNet-W48 phase segmentation for optical micrographs of high-elastic Al casting alloys (KoMaP 2026 Process 1)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "segmentation-models-pytorch==0.5.0",
    "timm==1.0.29",
    "albumentations==2.0.8",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.3",
    "pillow==12.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
