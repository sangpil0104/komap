<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlPhase · 학습 모니터</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101820;color:#e6eef4}body{max-width:1180px;margin:42px auto;padding:0 24px}h1{font-size:30px;margin-bottom:8px}p{color:#9bb0c1}small{color:#9bb0c1}main{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,section{background:#192530;border:1px solid #293b48;border-radius:14px;padding:22px;margin:16px 0}.card strong{display:block;font-size:27px;margin-top:12px}progress{width:100%;height:24px;accent-color:#4bd4a2}#charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas{width:100%;height:230px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px;border-bottom:1px solid #293b48}.preview{width:100%;margin-top:14px;border-radius:8px}.tag{color:#4bd4a2}#error{color:#ffbd87;white-space:pre-wrap}@media(max-width:750px){main{grid-template-columns:1fr 1fr}#charts{grid-template-columns:1fr}}
</style>
<h1>AlPhase <span class="tag">학습 모니터</span></h1>
<p id="headline">학습 시작을 기다리고 있습니다. 3초마다 자동으로 갱신합니다.</p>
<main><div class="card"><small>전체 진행률</small><strong id="percent">—</strong></div><div class="card"><small>예상 남은 시간</small><strong id="eta">측정 대기</strong></div><div class="card"><small>경과 시간</small><strong id="elapsed">—</strong></div><div class="card"><small>최고 검증 mIoU</small><strong id="best">—</strong></div></main>
<section><p id="steps">—</p><progress id="progress" max="100" value="0"></progress><p id="detail">—</p><small id="finish"></small><p id="error"></p></section>
<div id="charts"><section><b>학습 loss</b><canvas id="loss"></canvas></section><section><b>검증 mIoU (%)</b><canvas id="miou"></canvas></section></div>
<section><b>단계별 학습 계획</b><table><thead><tr><th>단계</th><th>업데이트 수</th><th>초 / 업데이트</th></tr></thead><tbody id="stages"></tbody></table><p>업데이트 1회는 설정된 effective batch 전체의 역전파와 가중치 갱신입니다. 남은 시간은 측정 속도에 따라 갱신됩니다.</p></section>
<section><b>최근 검증 예시 · 원본 / 정답 / 예측</b><p>첫 검증 이후 표시됩니다.</p><img id="preview" class="preview" alt="최근 검증 결과" hidden></section>
<script>
const $=id=>document.getElementById(id);
const fmt=s=>s==null?'측정 중':`${Math.floor(s/3600)}시간 ${Math.floor(s/60)%60}분`;
function chart(id,points,color){const canvas=$(id),r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=230*d;const c=canvas.getContext('2d');c.scale(d,d);const w=r.width,h=230;if(!points.length)return;c.fillStyle='#9bb0c1';c.font='12px system-ui';let lo=Math.min(...points.map(p=>p[1])),hi=Math.max(...points.map(p=>p[1]));if(hi-lo<1e-6){lo-=.1;hi+=.1}const left=48,right=w-14,top=20,bottom=h-28;for(let i=0;i<4;i++){const y=top+(bottom-top)*i/3;c.fillText((hi-(hi-lo)*i/3).toFixed(2),0,y+4);c.strokeStyle='#293b48';c.beginPath();c.moveTo(left,y);c.lineTo(right,y);c.stroke()}const xmax=Math.max(...points.map(p=>p[0]),1);c.fillText('0',left,h-5);c.fillText(`${xmax} updates`,right-95,h-5);c.strokeStyle=color;c.lineWidth=2;c.beginPath();points.forEach((p,i)=>{const x=left+p[0]/xmax*(right-left),y=bottom-(p[1]-lo)/(hi-lo)*(bottom-top);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();for(const p of points){c.beginPath();c.arc(left+p[0]/xmax*(right-left),bottom-(p[1]-lo)/(hi-lo)*(bottom-top),2,0,2*Math.PI);c.fillStyle=color;c.fill()}}
async function refresh(){try{const response=await fetch('status.json',{cache:'no-store'});if(!response.ok)return;const s=await response.json();const names={training:'학습 중',validating:'전체 영상 검증 중',paused:'일시 중지',interrupted:'중단됨',failed:'실행 오류',completed:'완료'};const stale=Date.now()/1000-s.updated_at>180; $('headline').textContent=`${s.experiment} · ${names[s.state]||s.state}${stale&&['training','validating'].includes(s.state)?' · 갱신 지연 (프로세스 상태 확인)':''}`;$('percent').textContent=`${s.percent.toFixed(1)}%`;$('eta').textContent=fmt(s.remaining_seconds);$('elapsed').textContent=fmt(s.elapsed_seconds);$('best').textContent=s.best_miou==null?'첫 검증 대기':`${s.best_miou.toFixed(2)}%`;$('progress').value=s.percent;$('steps').textContent=`${s.update.toLocaleString()} / ${s.total_updates.toLocaleString()} updates · ${s.stage}`;$('detail').textContent=`현재 단계 ${s.stage_step} / ${s.stage_total} · loss ${s.loss?.toFixed(4)??'—'} · GPU 메모리 ${s.gpu_memory_gb?.toFixed(1)??'—'} GB`;$('finish').textContent=s.estimated_finish?`예상 완료: ${new Date(s.estimated_finish*1000).toLocaleString()}${s.eta_provisional?' · 미측정 단계는 해상도 기반 임시 추정':''}`:'';$('error').textContent=s.error||'';$('stages').replaceChildren(...s.stages.map(t=>{const tr=document.createElement('tr');for(const value of [t.name,t.updates.toLocaleString(),t.seconds_per_update?.toFixed(2)??'측정 전']){const td=document.createElement('td');td.textContent=value;tr.append(td)}return tr}));const history=await fetch('metrics.jsonl',{cache:'no-store'});if(history.ok){const points=(await history.text()).trim().split('\n').flatMap(line=>{try{return[JSON.parse(line)]}catch{return[]}});chart('loss',points.filter(p=>p.loss!=null).map(p=>[p.update,p.loss]),'#4bd4a2');chart('miou',points.filter(p=>p.validation_miou!=null).map(p=>[p.update,p.validation_miou]),'#72a9ff')}if(s.validation_weights){const img=$('preview');img.onload=()=>img.hidden=false;img.src=`validation/${s.validation_weights}/preview_1.png?t=${s.update}`}}catch(e){$('error').textContent='상태를 읽는 중입니다: '+e.message}}
refresh();setInterval(refresh,3000);
</script></html>
