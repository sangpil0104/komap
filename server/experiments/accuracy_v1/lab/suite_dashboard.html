<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlPhase 실험 진행</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#101820;color:#e6eef4;max-width:1150px;margin:36px auto;padding:0 20px}p,small{color:#afc3d3}a{color:#6fdbb8}h1{font-size:28px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,section{background:#192530;border:1px solid #304251;border-radius:14px;padding:24px;margin:16px 0}strong{display:block;font-size:26px;margin-top:12px}progress{width:100%;height:22px;accent-color:#4bd4a2}.item{display:grid;grid-template-columns:1fr 2fr 1fr;gap:20px;align-items:center;border-top:1px solid #304251;padding:24px 0}.item p{margin:8px 0}#error{color:#ffc28c}@media(max-width:650px){.row{grid-template-columns:1fr}.item{grid-template-columns:1fr}strong{font-size:24px}}</style>
<h1>AlPhase · 정확도 개선 실험</h1><p id="state">실험 시작을 기다리고 있습니다. 3초마다 자동 갱신합니다.</p>
<div class="row"><div class="card"><small>전체 학습 진행률</small><strong id="progressText">0.0%</strong></div><div class="card"><small>학습 남은 시간 추정</small><strong id="eta">측정 대기</strong></div><div class="card"><small>진행 중인 작업</small><strong id="active">대기</strong></div></div>
<section><progress id="overall" max="100" value="0"></progress><p>학습 업데이트 기준입니다. 후속 D4·앙상블 평가 시간은 별도입니다. 초기 시간은 기존 CNN 측정치로 추정하며 각 실험의 실제 속도로 갱신합니다.</p><div id="experiments"></div></section>
<section><b>결과 비교</b><p><a href="reports/comparison.html" target="_blank">기존 모델과 새 모델의 mIoU 비교표 열기</a></p><p>기존 모델: 78.47% · 기존 모델 + D4: 78.69%. 모델별 상세 화면에서 loss, mIoU 그래프와 예측 예시를 확인할 수 있습니다.</p><p id="error"></p></section>
<script>const names=['fullframe','boundary','seed2027','seed2028'];const labels={fullframe:'전체 영상 비중 증가',boundary:'경계 보조 손실 0.05',seed2027:'기존 설정 · seed 2027',seed2028:'기존 설정 · seed 2028'};const $=id=>document.getElementById(id);const duration=s=>s==null?'측정 대기':`${Math.floor(s/3600)}시간 ${Math.ceil(s%3600/60)}분`;async function get(url){const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null}async function refresh(){try{const journal=await get('suite_status.json');const states=await Promise.all(names.map(n=>get(`runs/${n}/official/status.json`)));const total=states.reduce((v,s)=>v+(s?.update||0),0);$('overall').value=100*total/18000;$('progressText').textContent=(100*total/18000).toFixed(1)+'%';$('active').textContent=journal?.active_experiment||'대기';$('state').textContent=journal?.state==='completed'?'전체 학습·평가·앙상블 완료':journal?.state==='interrupted'?'실행 중단 · 같은 suite 명령으로 재개 가능':journal?.phase||'학습 시작 대기';let remaining=0,known=true;$('experiments').replaceChildren(...names.map((name,i)=>{const s=states[i],done=s?.state==='completed';const seconds=done?0:s?.remaining_seconds??journal?.estimated_seconds?.[name];if(seconds==null)known=false;else remaining+=seconds;const box=document.createElement('div');box.className='item';const title=document.createElement('div');const a=document.createElement('a');a.href=`runs/${name}/official/index.html`;a.textContent=name;a.target='_blank';title.append(a);const label=document.createElement('p');label.textContent=labels[name];title.append(label);const middle=document.createElement('div');const bar=document.createElement('progress');bar.max=4500;bar.value=s?.update||0;const status=document.createElement('p');status.textContent=`${s?.update||0} / 4500 · ${done?'완료':s?.state||'시작 전'}`;middle.append(bar,status);const score=document.createElement('div');score.textContent=s?.best_miou==null?'첫 검증 대기':`최고 ${s.best_miou.toFixed(2)}%`;box.append(title,middle,score);return box}));$('eta').textContent=duration(known?remaining:null);$('error').textContent=journal?.error||''}catch(e){$('error').textContent=e.message}}refresh();setInterval(refresh,3000);</script></html>
